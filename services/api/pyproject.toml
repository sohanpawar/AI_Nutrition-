[project]
name = "ai-nutrition-api"
version = "0.1.0"
description = "AI Nutrition Assistant API (Milestone 1)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "openai>=1.55.0",
  "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uvicorn]
factory = false
